<!-- BibTeX Modal -->
<div id="bibtex-modal" class="bibtex-modal" style="display: none;">
  <div class="bibtex-modal-content">
    <div class="bibtex-modal-header">
      <h3>BibTeX</h3>
      <span class="bibtex-close">&times;</span>
    </div>
    <div class="bibtex-modal-body">
      <pre id="bibtex-content"></pre>
    </div>
    <div class="bibtex-modal-footer">
      <button id="copy-bibtex" class="btn btn-primary">Copy</button>
      <button class="btn btn-secondary bibtex-close">Close</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Use event delegation - listen for clicks on the document
  document.addEventListener('click', function(e) {
    // Check if the clicked element is a Cite link
    if (e.target.classList.contains('cite-link') || e.target.classList.contains('bibtex-link')) {
      e.preventDefault();
      e.stopPropagation();
      
      console.log('Cite link clicked!');
      
      const bibtexUrl = e.target.getAttribute('data-bibtex-url');
      
      if (!bibtexUrl) {
        console.error('No BibTeX URL found');
        return;
      }
      
      console.log('Fetching BibTeX from:', bibtexUrl);
      
      // Fetch BibTeX content
      fetch(bibtexUrl)
        .then(response => {
          console.log('Response status:', response.status);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then(data => {
          console.log('BibTeX data received:', data);
          
          // Create a simple modal that will definitely work
          const existingModal = document.getElementById('simple-bibtex-modal');
          if (existingModal) {
            existingModal.remove();
          }
          
          // Create new modal
          const modal = document.createElement('div');
          modal.id = 'simple-bibtex-modal';
          modal.innerHTML = `
            <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center;">
              <div style="background: white; padding: 30px; border-radius: 10px; max-width: 80%; max-height: 80%; overflow: auto; position: relative;">
                <button onclick="this.parentElement.parentElement.remove()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
                <h3 style="margin-top: 0;">BibTeX</h3>
                <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow: auto; white-space: pre-wrap;">${data}</pre>
                <button onclick="navigator.clipboard.writeText(\`${data}\`); this.textContent='Copied!'; setTimeout(() => this.textContent='Copy', 2000)" style="margin-top: 15px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Copy</button>
              </div>
            </div>
          `;
          
          document.body.appendChild(modal);
          console.log('Modal created and added to DOM');
          
          // Close on outside click
          modal.addEventListener('click', function(e) {
            if (e.target === modal) {
              modal.remove();
            }
          });
        })
        .catch(error => {
          console.error('Error loading BibTeX:', error);
          alert('Error loading BibTeX: ' + error.message);
        });
    }
  });
});
</script>
